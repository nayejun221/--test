<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>집에못갈지도 · 카카오 + TAGO + 서울버스 통합 테스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      max-width: 540px;
      margin: 0 auto;
      padding: 16px 16px 48px;
      font-size: 14px;
    }
    h1 { font-size: 18px; color: #fbbf24; margin-bottom: 12px; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    .row { display: flex; gap: 6px; margin-bottom: 6px; }
    input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 13px;
    }
    button {
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary {
      width: 100%;
      background: #fbbf24;
      color: #0f172a;
      padding: 12px;
      font-size: 14px;
      margin-top: 6px;
    }
    .dropdown {
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      margin-bottom: 8px;
      max-height: 160px;
      overflow-y: auto;
    }
    .dropdown button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      padding: 8px 10px;
      border-bottom: 1px solid #1e293b;
      border-radius: 0;
      font-weight: 400;
      white-space: normal;
    }
    .dropdown button:hover { background: #1e293b; color: #fbbf24; }
    .selected { font-size: 11px; color: #4ade80; margin-bottom: 8px; }
    .log-box {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.55;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }
    .route-card {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      margin-right: 4px;
    }
    .src-seoul { background: #1e3a8a; color: #93c5fd; }
    .src-tago { background: #3b0764; color: #d8b4fe; }
    .ok { background: #14532d; color: #4ade80; }
    .fail { background: #7f1d1d; color: #fca5a5; }
    .taxi-box {
      margin-top: 8px;
      background: #292524;
      border: 1px solid #f59e0b;
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 12px;
      color: #fde68a;
    }
  </style>
</head>
<body>
  <h1>🌙 집에못갈지도 (카카오 + TAGO + 서울버스 테스트)</h1>

  <div class="card">
    <label>출발지 (예: 강남역, 홍대입구역, 수원역)</label>
    <div class="row">
      <input type="text" id="startInput" value="강남역">
      <button onclick="searchPlace('start')">검색</button>
    </div>
    <div class="selected" id="startInfo">✓ 강남역 (127.0276, 37.4979)</div>
    <div class="dropdown" id="startList" style="display:none;"></div>

    <label>도착지 (예: 신촌역, 잠실역, 영통역)</label>
    <div class="row">
      <input type="text" id="endInput" value="신촌역">
      <button onclick="searchPlace('end')">검색</button>
    </div>
    <div class="selected" id="endInfo">✓ 신촌역 (126.9368, 37.5551)</div>
    <div class="dropdown" id="endList" style="display:none;"></div>

    <button class="btn-primary" onclick="runTestSearch()">경로 · 막차 · 하이브리드 택시 계산 실행</button>
  </div>

  <div class="log-box" id="logBox">대기 중... 버튼을 누르면 권역(서울/전국)을 자동 판별해 API를 호출합니다.</div>
  <div id="resultList"></div>

  <script>
    const KAKAO_REST_KEY = '00635a15cd451240a8fd6e37cee0da22';
    const DATA_GO_KEY = '47ea28e67f66fd4cdabbef04e11814c90f7b7b8200c30ab7fdb040e804c5b91a';

    // 중복 호출 방지를 위한 세션 캐시
    const routeDetailCache = new Map();

    let places = {
      start: { name: '강남역', x: 127.0276, y: 37.4979 },
      end: { name: '신촌역', x: 126.9368, y: 37.5551 }
    };

    function log(msg) {
      document.getElementById('logBox').textContent += '\n' + msg;
    }

    function clearLog(msg) {
      document.getElementById('logBox').textContent = msg;
    }

    function isSeoulArea(lat, lng) {
      return lat >= 37.41 && lat <= 37.70 && lng >= 126.76 && lng <= 127.19;
    }

    // 1. 카카오 장소/주소 검색
    async function searchPlace(type) {
      const q = document.getElementById(type + 'Input').value.trim();
      const listEl = document.getElementById(type + 'List');
      if (!q) return;

      listEl.style.display = 'block';
      listEl.innerHTML = '<button>검색 중...</button>';

      try {
        const headers = { 'Authorization': `KakaoAK ${KAKAO_REST_KEY}` };
        const [kwRes, addrRes] = await Promise.all([
          fetch(`https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(q)}&size=4`, { headers }),
          fetch(`https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(q)}&analyze_type=similar&size=4`, { headers })
        ]);
        const [kwData, addrData] = await Promise.all([kwRes.json(), addrRes.json()]);

        const items = [
          ...(addrData.documents || []).map(d => ({
            name: d.road_address?.address_name || d.address_name,
            sub: d.address_name,
            x: Number(d.x),
            y: Number(d.y)
          })),
          ...(kwData.documents || []).map(d => ({
            name: d.place_name,
            sub: d.road_address_name || d.address_name || '',
            x: Number(d.x),
            y: Number(d.y)
          }))
        ];

        if (items.length === 0) {
          listEl.innerHTML = '<button>검색 결과가 없습니다.</button>';
          return;
        }

        listEl.innerHTML = '';
        items.forEach(item => {
          const btn = document.createElement('button');
          btn.innerHTML = `<b>${item.name}</b><br><small style="color:#94a3b8">${item.sub}</small>`;
          btn.onclick = () => {
            places[type] = { name: item.name, x: item.x, y: item.y };
            document.getElementById(type + 'Input').value = item.name;
            document.getElementById(type + 'Info').textContent = `✓ ${item.name} (${item.x}, ${item.y})`;
            listEl.style.display = 'none';
          };
          listEl.appendChild(btn);
        });
      } catch (e) {
        listEl.innerHTML = `<button style="color:#fca5a5">에러: ${e}</button>`;
      }
    }

    function calcDistM(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // ==================== [서울특별시 버스 API] ====================
    async function getSeoulNearbyStations(lat, lng) {
      if (!isSeoulArea(lat, lng)) return [];
      const url = `https://ws.bus.go.kr/api/rest/stationinfo/getStationByPos?serviceKey=${DATA_GO_KEY}&tmX=${lng}&tmY=${lat}&radius=450&resultType=json`;
      const res = await fetch(url);
      const data = await res.json();
      const list = data.msgBody?.itemList || [];
      return list.map(s => ({
        source: 'SEOUL',
        nodeid: String(s.stationId),
        arsId: String(s.arsId || ''),
        nodenm: s.stationNm,
        lat: Number(s.gpsY),
        lng: Number(s.gpsX)
      }));
    }

    async function getSeoulStationRoutes(arsId) {
      if (!arsId || arsId === '0') return [];
      const url = `https://ws.bus.go.kr/api/rest/stationinfo/getRouteByStation?serviceKey=${DATA_GO_KEY}&arsId=${arsId}&resultType=json`;
      const res = await fetch(url);
      const data = await res.json();
      const list = data.msgBody?.itemList || [];
      return list.map(r => ({
        source: 'SEOUL',
        routeid: String(r.busRouteId),
        routeno: String(r.busRouteNm)
      }));
    }

    async function getSeoulRouteDetail(routeid) {
      const cacheKey = `SEOUL_${routeid}`;
      if (routeDetailCache.has(cacheKey)) return routeDetailCache.get(cacheKey);

      const url = `https://ws.bus.go.kr/api/rest/busRouteInfo/getStaionByRoute?serviceKey=${DATA_GO_KEY}&busRouteId=${routeid}&resultType=json`;
      const res = await fetch(url);
      const data = await res.json();
      const list = data.msgBody?.itemList || [];

      const result = {
        stations: list.map(s => ({
          nodeid: String(s.station),
          arsId: String(s.arsId || ''),
          nodenm: s.stationNm,
          lat: Number(s.gpsY),
          lng: Number(s.gpsX),
          lastTm: s.lastTm || '' // 예: "20261118234000" 또는 "2340"
        }))
      };
      routeDetailCache.set(cacheKey, result);
      return result;
    }

    // ==================== [국토교통부 TAGO 버스 API] ====================
    async function getTagoNearbyStations(lat, lng) {
      const url = `https://apis.data.go.kr/1613000/BusSttnInfoInqireService/getCrdntPrxmtSttnList?serviceKey=${DATA_GO_KEY}&gpsLati=${lat}&gpsLong=${lng}&numOfRows=5&pageNo=1&_type=json`;
      const res = await fetch(url);
      const data = await res.json();
      const raw = data.response?.body?.items?.item;
      const list = !raw ? [] : (Array.isArray(raw) ? raw : [raw]);
      return list.map(s => ({
        source: 'TAGO',
        citycode: String(s.citycode),
        nodeid: String(s.nodeid),
        nodenm: s.nodenm,
        lat: Number(s.gpslati),
        lng: Number(s.gpslong)
      }));
    }

    async function getTagoStationRoutes(citycode, nodeid) {
      const url = `https://apis.data.go.kr/1613000/BusSttnInfoInqireService/getSttnThrghRouteList?serviceKey=${DATA_GO_KEY}&cityCode=${citycode}&nodeid=${nodeid}&numOfRows=30&pageNo=1&_type=json`;
      const res = await fetch(url);
      const data = await res.json();
      const raw = data.response?.body?.items?.item;
      const list = !raw ? [] : (Array.isArray(raw) ? raw : [raw]);
      return list.map(r => ({
        source: 'TAGO',
        citycode: String(r.citycode),
        routeid: String(r.routeid),
        routeno: String(r.routeno)
      }));
    }

    async function getTagoRouteDetail(citycode, routeid) {
      const cacheKey = `TAGO_${citycode}_${routeid}`;
      if (routeDetailCache.has(cacheKey)) return routeDetailCache.get(cacheKey);

      const infoUrl = `https://apis.data.go.kr/1613000/BusRouteInfoInqireService/getRouteInfoIem?serviceKey=${DATA_GO_KEY}&cityCode=${citycode}&routeId=${routeid}&_type=json`;
      const sttnUrl = `https://apis.data.go.kr/1613000/BusRouteInfoInqireService/getRouteAcctoThrghSttnList?serviceKey=${DATA_GO_KEY}&cityCode=${citycode}&routeId=${routeid}&numOfRows=200&pageNo=1&_type=json`;

      const [infoRes, sttnRes] = await Promise.all([fetch(infoUrl), fetch(sttnUrl)]);
      const [infoJson, sttnJson] = await Promise.all([infoRes.json(), sttnRes.json()]);

      const info = infoJson.response?.body?.items?.item || null;
      const rawSttns = sttnJson.response?.body?.items?.item;
      const list = !rawSttns ? [] : (Array.isArray(rawSttns) ? rawSttns : [rawSttns]);

      const result = {
        endvehicletime: info?.endvehicletime || '',
        stations: list.map(s => ({
          nodeid: String(s.nodeid),
          nodenm: s.nodenm,
          lat: Number(s.gpslati),
          lng: Number(s.gpslong)
        }))
      };
      routeDetailCache.set(cacheKey, result);
      return result;
    }

    // ==================== [카카오 모빌리티 택시] ====================
    async function getKakaoTaxi(ox, oy, dx, dy) {
      try {
        const url = `https://apis-navi.kakaomobility.com/v1/directions?origin=${ox},${oy}&destination=${dx},${dy}&priority=RECOMMEND`;
        const res = await fetch(url, { headers: { 'Authorization': `KakaoAK ${KAKAO_REST_KEY}` } });
        const data = await res.json();
        const route = data.routes?.[0];
        if (!route || route.result_code !== 0) return null;
        return {
          min: Math.round(route.summary.duration / 60),
          km: (route.summary.distance / 1000).toFixed(1),
          fare: route.summary.fare?.taxi || 0
        };
      } catch (e) {
        return null;
      }
    }

    // 막차 시각 파싱 ("20261118234000" 또는 "2340" 또는 "23:40" 모두 지원)
    function checkLastBus(rawStr, boardDate) {
      if (!rawStr) return null;
      const digits = String(rawStr).replace(/\D/g, '');
      let hhmm = '';
      if (digits.length === 14) hhmm = digits.slice(8, 12);
      else if (digits.length >= 4) hhmm = digits.slice(0, 4);
      else return null;

      const lh = Number(hhmm.slice(0, 2));
      const lm = Number(hhmm.slice(2, 4));
      if (isNaN(lh) || isNaN(lm)) return null;

      const toServiceMin = (h, m) => (h < 4 ? h + 24 : h) * 60 + m;
      const lastMin = toServiceMin(lh, lm);
      const boardMin = toServiceMin(boardDate.getHours(), boardDate.getMinutes());
      const diff = lastMin - boardMin;

      return {
        formatted: `${String(lh).padStart(2, '0')}:${String(lm).padStart(2, '0')}`,
        diff,
        isAvailable: diff >= 0
      };
    }

    function fmtTime(d) {
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    // ==================== [통합 실행] ====================
    async function runTestSearch() {
      const resEl = document.getElementById('resultList');
      resEl.innerHTML = '';
      clearLog('1. 출발지·도착지 주변 정류장 동시 조회 중 (서울버스 + TAGO)...');

      try {
        const [
          seoulStart, tagoStart,
          seoulEnd, tagoEnd,
          directTaxi
        ] = await Promise.all([
          getSeoulNearbyStations(places.start.y, places.start.x),
          getTagoNearbyStations(places.start.y, places.start.x),
          getSeoulNearbyStations(places.end.y, places.end.x),
          getTagoNearbyStations(places.end.y, places.end.x),
          getKakaoTaxi(places.start.x, places.start.y, places.end.x, places.end.y)
        ]);

        const startSttns = [...seoulStart, ...tagoStart];
        const endSttns = [...seoulEnd, ...tagoEnd];

        log(`   → 출발 정류장: 서울 ${seoulStart.length}개, 전국(TAGO) ${tagoStart.length}개`);
        log(`   → 도착 정류장: 서울 ${seoulEnd.length}개, 전국(TAGO) ${tagoEnd.length}개`);

        if (directTaxi) {
          resEl.innerHTML += `
            <div class="route-card" style="border-color:#f59e0b;">
              <b style="color:#fbbf24;">🚕 직행 택시 기준 (카카오 모빌리티)</b>
              <div style="margin-top:4px;">예상 요금 <b>${directTaxi.fare.toLocaleString()}원</b> · 약 ${directTaxi.min}분 (${directTaxi.km}km)</div>
            </div>
          `;
        }

        if (startSttns.length === 0 || endSttns.length === 0) {
          log('❌ 주변 반경 내 버스 정류장을 찾지 못했습니다.');
          return;
        }

        log('2. 출발 정류장별 경유 노선 조회 중...');
        const routeQueries = [
          ...seoulStart.slice(0, 3).map(st => getSeoulStationRoutes(st.arsId).then(routes => ({ sttn: st, routes }))),
          ...tagoStart.slice(0, 3).map(st => getTagoStationRoutes(st.citycode, st.nodeid).then(routes => ({ sttn: st, routes })))
        ];
        const startRoutesList = await Promise.all(routeQueries);

        const candidateMap = new Map();
        startRoutesList.forEach(({ sttn, routes }) => {
          routes.forEach(r => {
            const key = `${r.source}_${r.citycode || ''}_${r.routeid}`;
            if (!candidateMap.has(key)) {
              candidateMap.set(key, { ...r, startSttn: sttn });
            }
          });
        });

        log(`3. 후보 노선 ${candidateMap.size}개 중 도착 정류장 경유 노선 매칭 중...`);
        const candidates = Array.from(candidateMap.values()).slice(0, 15);
        const now = new Date();
        let foundCount = 0;

        for (const cand of candidates) {
          const detail = cand.source === 'SEOUL'
            ? await getSeoulRouteDetail(cand.routeid)
            : await getTagoRouteDetail(cand.citycode, cand.routeid);

          const stations = detail.stations || [];
          if (stations.length === 0) continue;

          // 출발 정류장 인덱스 찾기 (nodeid 또는 arsId 매칭)
          const startIdx = stations.findIndex(s =>
            s.nodeid === cand.startSttn.nodeid || (cand.startSttn.arsId && s.arsId === cand.startSttn.arsId)
          );
          if (startIdx === -1) continue;

          // 도착지 주변 정류장(반경 450m 이내)과 매칭되는 하차 정류장 찾기
          const endIdx = stations.findIndex((s, idx) =>
            idx > startIdx && endSttns.some(es =>
              es.nodeid === s.nodeid || (es.arsId && s.arsId === es.arsId) || calcDistM(es.lat, es.lng, s.lat, s.lng) < 80
            )
          );

          if (endIdx !== -1) {
            foundCount++;
            const stopCount = endIdx - startIdx;
            const endSttn = stations[endIdx];
            const walkToStartMin = Math.max(1, Math.round((calcDistM(places.start.y, places.start.x, cand.startSttn.lat, cand.startSttn.lng) * 1.25) / 67));
            const walkFromEndMin = Math.max(1, Math.round((calcDistM(endSttn.lat, endSttn.lng, places.end.y, places.end.x) * 1.25) / 67));

            const busRideMin = stopCount * 2;
            const totalMin = walkToStartMin + busRideMin + walkFromEndMin;
            const arriveDest = new Date(now.getTime() + totalMin * 60000);
            const boardTime = new Date(now.getTime() + walkToStartMin * 60000);

            // 서울버스는 정류장별 lastTm, TAGO는 노선 기점 endvehicletime 사용
            const rawLastTm = cand.source === 'SEOUL' ? stations[startIdx].lastTm : detail.endvehicletime;
            const lastCheck = checkLastBus(rawLastTm, boardTime);

            const srcBadge = cand.source === 'SEOUL'
              ? `<span class="badge src-seoul">서울버스</span>`
              : `<span class="badge src-tago">전국TAGO</span>`;

            const badgeHtml = !lastCheck
              ? `<span class="badge">막차정보 없음</span>`
              : lastCheck.isAvailable
                ? `<span class="badge ok">막차 ${lastCheck.formatted} (${lastCheck.diff}분 여유)</span>`
                : `<span class="badge fail">막차 ${lastCheck.formatted} 종료</span>`;

            let hybridHtml = '';
            if (lastCheck && !lastCheck.isAvailable) {
              const subTaxi = await getKakaoTaxi(cand.startSttn.lng, cand.startSttn.lat, places.end.x, places.end.y);
              if (subTaxi) {
                hybridHtml = `
                  <div class="taxi-box">
                    <b>🚕 막차 종료 → 승차 정류장(${cand.startSttn.nodenm})에서 택시 전환</b><br>
                    도보 ${walkToStartMin}분 + 택시 ${subTaxi.min}분 = <b>총 ${walkToStartMin + subTaxi.min}분</b> · 예상 택시비 <b>${subTaxi.fare.toLocaleString()}원</b>
                  </div>
                `;
              }
            }

            resEl.innerHTML += `
              <div class="route-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                  <div>${srcBadge}<b style="font-size:16px; color:#4ade80;">🚌 ${cand.routeno}번</b> ${badgeHtml}</div>
                  <b style="font-size:17px;">약 ${totalMin}분</b>
                </div>
                <div style="font-size:12px; color:#cbd5e1; line-height:1.5;">
                  도착 예정 <b>${fmtTime(arriveDest)}</b> (${stopCount}개 정류장 이동)<br>
                  승차: ${cand.startSttn.nodenm} (도보 ${walkToStartMin}분) → 하차: ${endSttn.nodenm} (도보 ${walkFromEndMin}분)
                </div>
                ${hybridHtml}
              </div>
            `;
          }
        }

        log(foundCount > 0
          ? `✅ 완료! 직통 버스 경로 ${foundCount}개를 찾았습니다.`
          : '⚠️ 직통 버스 노선이 없습니다. (환승 경로 탐색 로직 추가 필요)');
      } catch (e) {
        log('❌ API 호출 오류: ' + e);
      }
    }
  </script>
</body>

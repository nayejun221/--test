<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>집에못갈지도 · 카카오 + TAGO 연동 테스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 16px 48px;
      font-size: 14px;
    }
    h1 { font-size: 19px; color: #fbbf24; margin-bottom: 12px; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    .row { display: flex; gap: 6px; margin-bottom: 6px; }
    input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 13px;
    }
    button {
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary {
      width: 100%;
      background: #fbbf24;
      color: #0f172a;
      padding: 12px;
      font-size: 14px;
      margin-top: 6px;
    }
    .dropdown {
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      margin-bottom: 8px;
      max-height: 160px;
      overflow-y: auto;
    }
    .dropdown button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      padding: 8px 10px;
      border-bottom: 1px solid #1e293b;
      border-radius: 0;
      font-weight: 400;
      white-space: normal;
    }
    .dropdown button:hover { background: #1e293b; color: #fbbf24; }
    .selected { font-size: 11px; color: #4ade80; margin-bottom: 8px; }
    .log-box {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.55;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }
    .route-card {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      margin-right: 5px;
    }
    .ok { background: #14532d; color: #4ade80; }
    .fail { background: #7f1d1d; color: #fca5a5; }
    .taxi-box {
      margin-top: 8px;
      background: #292524;
      border: 1px solid #f59e0b;
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 12px;
      color: #fde68a;
    }
  </style>
</head>
<body>
  <h1>🌙 집에못갈지도 (카카오 + TAGO 연동 테스트)</h1>

  <div class="card">
    <label>출발지 (예: 수원역, 아주대학교, 망포역)</label>
    <div class="row">
      <input type="text" id="startInput" value="수원역">
      <button onclick="searchPlace('start')">검색</button>
    </div>
    <div class="selected" id="startInfo">✓ 수원역 (127.0000, 37.2659)</div>
    <div class="dropdown" id="startList" style="display:none;"></div>

    <label>도착지 (예: 영통역, 광교중앙역, 동탄역)</label>
    <div class="row">
      <input type="text" id="endInput" value="영통역">
      <button onclick="searchPlace('end')">검색</button>
    </div>
    <div class="selected" id="endInfo">✓ 영통역 (127.0713, 37.2515)</div>
    <div class="dropdown" id="endList" style="display:none;"></div>

    <button class="btn-primary" onclick="runTestSearch()">경로 · 막차 · 하이브리드 택시 계산 실행</button>
  </div>

  <div class="log-box" id="logBox">대기 중... 버튼을 누르면 단계별 API 응답 상태를 표시합니다.</div>
  <div id="resultList"></div>

  <script>
    const KAKAO_REST_KEY = '00635a15cd451240a8fd6e37cee0da22';
    const TAGO_KEY = '47ea28e67f66fd4cdabbef04e11814c90f7b7b8200c30ab7fdb040e804c5b91a';

    let places = {
      start: { name: '수원역', x: 127.0000, y: 37.2659 },
      end: { name: '영통역', x: 127.0713, y: 37.2515 }
    };

    function log(msg) {
      const box = document.getElementById('logBox');
      box.textContent += '\n' + msg;
    }

    function clearLog(msg) {
      document.getElementById('logBox').textContent = msg;
    }

    // 1. 카카오 장소/주소 검색
    async function searchPlace(type) {
      const q = document.getElementById(type + 'Input').value.trim();
      const listEl = document.getElementById(type + 'List');
      if (!q) return;

      listEl.style.display = 'block';
      listEl.innerHTML = '<button>검색 중...</button>';

      try {
        const headers = { 'Authorization': `KakaoAK ${KAKAO_REST_KEY}` };
        const [kwRes, addrRes] = await Promise.all([
          fetch(`https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(q)}&size=4`, { headers }),
          fetch(`https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(q)}&analyze_type=similar&size=4`, { headers })
        ]);
        const [kwData, addrData] = await Promise.all([kwRes.json(), addrRes.json()]);

        const items = [
          ...(addrData.documents || []).map(d => ({
            name: d.road_address?.address_name || d.address_name,
            sub: d.address_name,
            x: Number(d.x),
            y: Number(d.y)
          })),
          ...(kwData.documents || []).map(d => ({
            name: d.place_name,
            sub: d.road_address_name || d.address_name || '',
            x: Number(d.x),
            y: Number(d.y)
          }))
        ];

        if (items.length === 0) {
          listEl.innerHTML = '<button>검색 결과가 없습니다.</button>';
          return;
        }

        listEl.innerHTML = '';
        items.forEach(item => {
          const btn = document.createElement('button');
          btn.innerHTML = `<b>${item.name}</b><br><small style="color:#94a3b8">${item.sub}</small>`;
          btn.onclick = () => {
            places[type] = { name: item.name, x: item.x, y: item.y };
            document.getElementById(type + 'Input').value = item.name;
            document.getElementById(type + 'Info').textContent = `✓ ${item.name} (${item.x}, ${item.y})`;
            listEl.style.display = 'none';
          };
          listEl.appendChild(btn);
        });
      } catch (e) {
        listEl.innerHTML = `<button style="color:#fca5a5">에러: ${e}</button>`;
      }
    }

    // Haversine 직선거리(m) 및 도보 시간(분)
    function calcDistM(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // 2. TAGO 주변 정류장 조회 (반경 500m)
    async function getNearbyStations(lat, lng) {
      const url = `https://apis.data.go.kr/1613000/BusSttnInfoInqireService/getCrdntPrxmtSttnList?serviceKey=${TAGO_KEY}&gpsLati=${lat}&gpsLong=${lng}&numOfRows=5&pageNo=1&_type=json`;
      const res = await fetch(url);
      const data = await res.json();
      const raw = data.response?.body?.items?.item;
      if (!raw) return [];
      return Array.isArray(raw) ? raw : [raw];
    }

    // 3. TAGO 정류장 경유 노선 목록 조회
    async function getStationRoutes(cityCode, nodeId) {
      const url = `https://apis.data.go.kr/1613000/BusSttnInfoInqireService/getSttnThrghRouteList?serviceKey=${TAGO_KEY}&cityCode=${cityCode}&nodeid=${nodeId}&numOfRows=30&pageNo=1&_type=json`;
      const res = await fetch(url);
      const data = await res.json();
      const raw = data.response?.body?.items?.item;
      if (!raw) return [];
      return Array.isArray(raw) ? raw : [raw];
    }

    // 4. TAGO 노선 기본정보(첫차·막차 시간) & 경유 정류장 목록 조회
    async function getRouteDetail(cityCode, routeId) {
      const infoUrl = `https://apis.data.go.kr/1613000/BusRouteInfoInqireService/getRouteInfoIem?serviceKey=${TAGO_KEY}&cityCode=${cityCode}&routeId=${routeId}&_type=json`;
      const sttnUrl = `https://apis.data.go.kr/1613000/BusRouteInfoInqireService/getRouteAcctoThrghSttnList?serviceKey=${TAGO_KEY}&cityCode=${cityCode}&routeId=${routeId}&numOfRows=200&pageNo=1&_type=json`;

      const [infoRes, sttnRes] = await Promise.all([fetch(infoUrl), fetch(sttnUrl)]);
      const [infoJson, sttnJson] = await Promise.all([infoRes.json(), sttnRes.json()]);

      const info = infoJson.response?.body?.items?.item || null;
      const rawSttns = sttnJson.response?.body?.items?.item;
      const stations = !rawSttns ? [] : (Array.isArray(rawSttns) ? rawSttns : [rawSttns]);
      return { info, stations };
    }

    // 5. 카카오 모빌리티 택시 시간/요금 조회
    async function getKakaoTaxi(ox, oy, dx, dy) {
      try {
        const url = `https://apis-navi.kakaomobility.com/v1/directions?origin=${ox},${oy}&destination=${dx},${dy}&priority=RECOMMEND`;
        const res = await fetch(url, { headers: { 'Authorization': `KakaoAK ${KAKAO_REST_KEY}` } });
        const data = await res.json();
        const route = data.routes?.[0];
        if (!route || route.result_code !== 0) return null;
        return {
          min: Math.round(route.summary.duration / 60),
          km: (route.summary.distance / 1000).toFixed(1),
          fare: route.summary.fare?.taxi || 0
        };
      } catch (e) {
        return null;
      }
    }

    // 막차 시각 문자열(예: "2330" 또는 "0020") 파싱 및 비교
    function checkLastBus(endTimeStr, boardDate) {
      if (!endTimeStr || String(endTimeStr).length < 4) return null;
      const s = String(endTimeStr).padStart(4, '0');
      const lh = Number(s.slice(0, 2));
      const lm = Number(s.slice(2, 4));
      const toServiceMin = (h, m) => (h < 4 ? h + 24 : h) * 60 + m;

      const lastMin = toServiceMin(lh, lm);
      const boardMin = toServiceMin(boardDate.getHours(), boardDate.getMinutes());
      const diff = lastMin - boardMin;
      return {
        formatted: `${String(lh).padStart(2, '0')}:${String(lm).padStart(2, '0')}`,
        diff,
        isAvailable: diff >= 0
      };
    }

    function fmtTime(d) {
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    // 6. 전체 실행 로직
    async function runTestSearch() {
      const resEl = document.getElementById('resultList');
      resEl.innerHTML = '';
      clearLog('1. 출발지·도착지 주변 정류장 조회 중 (TAGO)...');

      try {
        const [startSttns, endSttns, directTaxi] = await Promise.all([
          getNearbyStations(places.start.y, places.start.x),
          getNearbyStations(places.end.y, places.end.x),
          getKakaoTaxi(places.start.x, places.start.y, places.end.x, places.end.y)
        ]);

        log(`   → 출발 주변 정류장 ${startSttns.length}개 / 도착 주변 정류장 ${endSttns.length}개 발견`);

        if (directTaxi) {
          resEl.innerHTML += `
            <div class="route-card" style="border-color:#f59e0b;">
              <b style="color:#fbbf24;">🚕 직행 택시 기준 (카카오 모빌리티)</b>
              <div style="margin-top:4px;">예상 요금 <b>${directTaxi.fare.toLocaleString()}원</b> · 약 ${directTaxi.min}분 (${directTaxi.km}km)</div>
            </div>
          `;
        }

        if (startSttns.length === 0 || endSttns.length === 0) {
          log('❌ 주변 500m 이내에 TAGO 등록 버스정류장이 없습니다. (서울 내부 정류장은 TAGO 대신 서울버스 API 대상일 수 있습니다)');
          return;
        }

        log('2. 출발 정류장 경유 노선 조회 중...');
        const startRoutesList = await Promise.all(
          startSttns.slice(0, 3).map(st => getStationRoutes(st.citycode, st.nodeid).then(routes => ({ sttn: st, routes })))
        );

        const endNodeIds = new Set(endSttns.map(s => s.nodeid));
        const candidateMap = new Map();

        startRoutesList.forEach(({ sttn, routes }) => {
          routes.forEach(r => {
            const key = `${r.citycode}_${r.routeid}`;
            if (!candidateMap.has(key)) {
              candidateMap.set(key, { citycode: r.citycode, routeid: r.routeid, routeno: r.routeno, startSttn: sttn });
            }
          });
        });

        log(`3. 후보 노선 ${candidateMap.size}개 중 도착 정류장 경유 노선 매칭 중...`);
        const candidates = Array.from(candidateMap.values()).slice(0, 12);
        const now = new Date();
        let foundCount = 0;

        for (const cand of candidates) {
          const { info, stations } = await getRouteDetail(cand.citycode, cand.routeid);
          if (stations.length === 0) continue;

          const startIdx = stations.findIndex(s => s.nodeid === cand.startSttn.nodeid);
          const endIdx = stations.findIndex((s, idx) => idx > startIdx && endNodeIds.has(s.nodeid));

          if (startIdx !== -1 && endIdx !== -1) {
            foundCount++;
            const stopCount = endIdx - startIdx;
            const walkToStartMin = Math.max(1, Math.round((calcDistM(places.start.y, places.start.x, cand.startSttn.gpslati, cand.startSttn.gpslong) * 1.25) / 67));
            const endSttn = stations[endIdx];
            const walkFromEndMin = Math.max(1, Math.round((calcDistM(endSttn.gpslati, endSttn.gpslong, places.end.y, places.end.x) * 1.25) / 67));

            // 정류장당 평균 2분 + 도보 시간 합산
            const busRideMin = stopCount * 2;
            const totalMin = walkToStartMin + busRideMin + walkFromEndMin;
            const arriveDest = new Date(now.getTime() + totalMin * 60000);
            const boardTime = new Date(now.getTime() + walkToStartMin * 60000);

            const lastCheck = checkLastBus(info?.endvehicletime, boardTime);
            const badgeHtml = !lastCheck
              ? `<span class="badge">막차정보 없음</span>`
              : lastCheck.isAvailable
                ? `<span class="badge ok">기점막차 ${lastCheck.formatted} (${lastCheck.diff}분 여유)</span>`
                : `<span class="badge fail">기점막차 ${lastCheck.formatted} 종료</span>`;

            let hybridHtml = '';
            if (lastCheck && !lastCheck.isAvailable) {
              const subTaxi = await getKakaoTaxi(cand.startSttn.gpslong, cand.startSttn.gpslati, places.end.x, places.end.y);
              if (subTaxi) {
                hybridHtml = `
                  <div class="taxi-box">
                    <b>🚕 막차 종료 → 승차 정류장(${cand.startSttn.nodenm})에서 택시 전환</b><br>
                    도보 ${walkToStartMin}분 + 택시 ${subTaxi.min}분 = <b>총 ${walkToStartMin + subTaxi.min}분</b> · 예상 택시비 <b>${subTaxi.fare.toLocaleString()}원</b>
                  </div>
                `;
              }
            }

            resEl.innerHTML += `
              <div class="route-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                  <div><b style="font-size:16px; color:#4ade80;">🚌 ${cand.routeno}번 버스</b> ${badgeHtml}</div>
                  <b style="font-size:17px;">약 ${totalMin}분</b>
                </div>
                <div style="font-size:12px; color:#cbd5e1; line-height:1.5;">
                  도착 예정 <b>${fmtTime(arriveDest)}</b> (${stopCount}개 정류장 이동)<br>
                  승차: ${cand.startSttn.nodenm} (도보 ${walkToStartMin}분) → 하차: ${endSttn.nodenm} (도보 ${walkFromEndMin}분)
                </div>
                ${hybridHtml}
              </div>
            `;
          }
        }

        log(foundCount > 0
          ? `✅ 완료! 직통 버스 경로 ${foundCount}개를 찾았습니다.`
          : '⚠️ 직통 버스 노선이 없습니다. (환승 경로 탐색 로직 추가 필요)');
      } catch (e) {
        log('❌ API 호출 오류: ' + e);
      }
    }
  </script>
</body>
</html>

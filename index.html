<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>집에못갈지도 · 막차 & 하이브리드 길찾기</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 16px 48px;
    }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    h1 { font-size: 20px; color: #fbbf24; }
    .clock { font-size: 12px; color: #94a3b8; background: #1e293b; padding: 5px 10px; border-radius: 99px; border: 1px solid #334155; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .search-group { margin-bottom: 10px; position: relative; }
    .search-group label { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    .row { display: flex; gap: 6px; }
    input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-gps { background: #1d4ed8; color: #eff6ff; font-size: 12px; padding: 0 10px; }
    .btn-primary {
      width: 100%;
      background: #fbbf24;
      color: #0f172a;
      padding: 13px;
      font-size: 15px;
      margin-top: 4px;
    }
    .btn-swap {
      background: transparent;
      color: #94a3b8;
      font-size: 12px;
      padding: 4px 0;
      margin-bottom: 6px;
    }
    .dropdown {
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      margin-top: 4px;
      max-height: 200px;
      overflow-y: auto;
    }
    .dropdown button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      padding: 10px 12px;
      border-bottom: 1px solid #1e293b;
      border-radius: 0;
      font-weight: 400;
      line-height: 1.35;
    }
    .dropdown button:hover { background: #1e293b; color: #fbbf24; }
    .dropdown small { display: block; color: #64748b; font-size: 11px; }
    .tag-type {
      display: inline-block;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      margin-right: 4px;
      background: #334155;
      color: #cbd5e1;
      vertical-align: middle;
    }
    .selected-info { font-size: 11px; color: #4ade80; margin-top: 4px; }

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<meta content="#0b1117" name="theme-color" id="themeColorMeta"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>집에 못 갈 지도 - 서울시 전용 초고속 길찾기 &amp; AI 챗봇</title>
<link rel="manifest" href="./manifest.json"/>

<!-- Leaflet CSS & QRCode -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
--bg:#0b1117;--body-bg:#070c11;--card:#171f29;--text:#f2f4f5;--text-sub:#c2cad0;
--yellow:#ffb918;--muted:#919ba6;--line:#2a3440;--green:#242f23;--red:#e55353;--blue:#3b82f6;
--bottom-bg:#0b1117f5;--input-bg:#171f29;--chip-on-bg:#33351f;--chip-on-border:#7d6b29;
}
body.light-theme{
--bg:#ffffff;--body-bg:#f0f2f5;--card:#f8f9fa;--text:#111827;--text-sub:#4b5563;
--yellow:#d97706;--muted:#6b7280;--line:#e5e7eb;--green:#eaf3e8;--red:#ef4444;--blue:#2563eb;
--bottom-bg:#fffffff2;--input-bg:#ffffff;--chip-on-bg:#fef3c7;--chip-on-border:#d97706;
}
*{box-sizing:border-box}
body{margin:0;background:var(--body-bg);color:var(--text);font:14px system-ui,'Apple SD Gothic Neo','Nanum Gothic',sans-serif;transition:background-color 0.25s, color 0.25s}
button,input,select{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
.app{max-width:440px;min-height:100dvh;margin:auto;background:var(--bg);padding:20px 20px 105px;position:relative;box-shadow:0 0 25px rgba(0,0,0,0.1);overflow-x:hidden}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
header h1{font-size:21px;margin:0;letter-spacing:-.8px}
.icon{color:var(--yellow);font-size:24px;font-weight:400;margin-right:9px}
.plain{background:none;border:0;padding:6px;color:var(--muted)}
h2{font-size:19px;margin:0 0 15px;letter-spacing:-.7px}
h3{font-size:14px;margin:0 0 13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:12px}
.hero{background:var(--green);border:1px solid #39472b;padding:15px}
body.light-theme .hero{border-color:#bbf7d0}
.micro{font-size:10px;color:var(--muted);line-height:1.7}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.heroTop{font-size:10px;margin-bottom:13px}
.heroTop span:last-child{color:var(--muted);font-size:9px}
.heroInner{background:var(--card);border-radius:13px;padding:16px 13px;border:1px solid var(--line)}
.badge{display:inline-block;background:#303d21;color:var(--yellow);font-size:10px;border-radius:20px;padding:4px 9px;font-weight:bold}
body.light-theme .badge{background:#fef3c7;color:#b45309}
.badge-alert{background:#4d1b1b;color:#ff7b7b}
body.light-theme .badge-alert{background:#fee2e2;color:#b91c1c}
.badge-real{background:#1e354a;color:#7bd3ff}
.count{font-size:11px;color:var(--muted)}
.time{font-size:38px;color:var(--yellow);font-weight:750;letter-spacing:-2px;margin:12px 0 6px;line-height:1.2}
.time small{font-size:14px;letter-spacing:-.6px;font-weight:600;margin-left:4px}
.heroInner b{font-size:13px}
.heroInner p{margin:8px 0 0;font-size:11px;color:var(--text-sub)}
.routes{padding:13px}
.routes h3{font-size:12px;margin-bottom:10px}
.saved{border:1px solid transparent;background:transparent;display:flex;width:100%;align-items:center;text-align:left;border-radius:12px;padding:10px;gap:11px}
.saved.active{background:var(--green);border-color:#47532c}
body.light-theme .saved.active{border-color:#86efac}
.saved .symbol{font-size:21px;color:var(--yellow)}
.saved span small{display:block;color:var(--muted);font-size:9px;margin-bottom:2px}
.saved span b{font-size:13px}
.saved .arrow{margin-left:auto;color:var(--muted)}
.primary{width:100%;background:var(--yellow);border:0;color:#181b0d;border-radius:13px;padding:16px;font-size:13px;font-weight:800;text-align:left;display:flex;align-items:center;justify-content:space-between}
body.light-theme .primary{color:#ffffff}
.primary:disabled{opacity:.5;cursor:default}
.footnote{font-size:9px;color:var(--muted);text-align:center;line-height:1.8;margin-top:22px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);background:var(--bottom-bg);backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;padding:10px 8px max(14px,env(safe-area-inset-bottom));z-index:30}
.bottom button{flex:1;border:0;background:none;color:var(--muted);font-size:10px;font-weight:600;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:color 0.2s}
.bottom button svg{width:22px;height:22px;stroke:currentColor;display:block;transition:stroke 0.2s, transform 0.2s}
.bottom button.on{color:var(--yellow)}
.bottom button.on svg{stroke:var(--yellow);stroke-width:2.2}
.screen{display:none;animation:enter .18s ease}
.screen.on{display:block}
@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.location{font-size:12px;color:var(--text-sub);line-height:1.9;margin-bottom:12px}
.condition-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 12px}
.cond-btn{border:1px solid var(--line);background:var(--card);color:var(--text-sub);border-radius:10px;padding:9px 4px;font-size:11px;font-weight:700;text-align:center;transition:all 0.2s}
.cond-btn.on{background:var(--chip-on-bg);border-color:var(--chip-on-border);color:var(--yellow)}
.cond-btn:disabled{opacity:0.35;cursor:not-allowed;text-decoration:line-through}
.strategy{display:block;width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:15px;text-align:left;padding:17px;margin:10px 0;transition:all 0.2s}
.strategy.chosen{border-color:var(--yellow);background:#272a20}
body.light-theme .strategy.chosen{background:#fffbeb;border-color:var(--yellow)}
.strategy.warning{border-color:var(--red);background:#291919}
body.light-theme .strategy.warning{background:#fef2f2}
.strategy h3{margin:0;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.strategy .departure{font-size:22px;font-weight:750;margin-top:10px;letter-spacing:-1px}
.strategy .departure small{font-size:11px;font-weight:400;color:var(--muted)}
.strategy .fare{font-size:12px;margin-top:6px;color:var(--text-sub)}
.line-highlight-bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.line-badge-subway{background:#1d4ed8;color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px}
.line-badge-bus{background:#15803d;color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px}
.line-badge-nightbus{background:#991b1b;color:#fecaca;font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px
